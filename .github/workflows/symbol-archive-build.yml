name: symbol-archive build (AE/SE/VR)

# Builds real CommonLibSSE-NG type archives (.gdt) for each supported
# runtime and publishes them as workflow artifacts -- see
# symbol-archive/README.md. Matrix mirrors type-importer-coverage.yml's
# own AE/SE/VR runtime matrix (see that workflow for the pattern this
# copies) -- GOG isn't listed separately because type-importer's Track 1
# work confirmed it shares AE 1.6.1170's macro/layout with no distinct
# static_assert set to validate against (see
# type-importer/COVERAGE_SWEEP_PLAN.md's v0.2 writeup).
#
# This is NOT a quality gate (unlike type-importer-coverage.yml, which
# fails the build on regression). type-importer's own coverage sweep
# currently shows 1,934/3,019 (64%) of checkable classes as byte-accurate
# (see type-importer/COVERAGE_SWEEP_PLAN.md) -- this workflow exists to
# produce real, traceable build artifacts for testing/dogfooding, not to
# assert any archive is fully trustworthy. Don't gate this on the
# coverage sweep passing; that would block every build indefinitely
# until type-importer's pass rate is much higher.
#
# Manual dispatch only for now -- see symbol-archive/README.md's roadmap
# for why this isn't push-triggered yet. Set the publish_release input to
# also cut a public, versioned GitHub Release for each runtime in the
# matrix (off by default).
#
# Toolchain versions match type-importer-coverage.yml (keep them in sync
# if either is bumped): Ghidra 12.1.3, LLVM/libclang 19.1.0, JDK 25
# (Temurin), xwin 0.10.0. Fully Linux-native.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: >-
          Publish this build as a public, versioned GitHub Release per
          runtime (in addition to the usual workflow artifact). Leave
          unchecked for a normal test/dogfooding build.
        type: boolean
        default: false
      release_tag_prefix:
        description: >-
          Release tag prefix to use when publish_release is checked, e.g.
          "v1" produces tags "ae-1.6.1170-v1", "se-1.5.97-v1",
          "vr-1.4.15-v1". Required only when publishing.
        type: string
        default: ""

env:
  GHIDRA_VERSION: "12.1.3"
  GHIDRA_ASSET: "ghidra_12.1.3_PUBLIC_20260817.zip"
  LLVM_VERSION: "19.1.0"
  XWIN_VERSION: "0.10.0"

jobs:
  build-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_macro: ENABLE_SKYRIM_AE
            runtime_label: AE
            runtime_version: "1.6.1170"
          - runtime_macro: ENABLE_SKYRIM_SE
            runtime_label: SE
            runtime_version: "1.5.97"
          - runtime_macro: ENABLE_SKYRIM_VR
            runtime_label: VR
            runtime_version: "1.4.15"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/tools/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}

      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools
          curl -fL -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_ASSET}"
          unzip -q /tmp/ghidra.zip -d ~/tools/ghidra-extract
          mv ~/tools/ghidra-extract/ghidra_${GHIDRA_VERSION}_PUBLIC ~/tools/ghidra

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/tools/llvm
          key: llvm-${{ env.LLVM_VERSION }}

      - name: Download LLVM (for libclang 19+ -- system libclang is too old, see type-importer/DESIGN.md)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools
          curl -fL -o /tmp/llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          mkdir -p ~/tools/llvm
          tar -xf /tmp/llvm.tar.xz -C ~/tools/llvm --strip-components=1

      - name: Cache xwin Windows SDK/CRT splat
        id: cache-winsdk
        uses: actions/cache@v4
        with:
          path: ~/tools/winsdk
          key: winsdk-xwin-${{ env.XWIN_VERSION }}-v1

      - name: Acquire Windows SDK/CRT headers via xwin
        if: steps.cache-winsdk.outputs.cache-hit != 'true'
        run: |
          # Microsoft's own license terms apply to the splat output (see
          # type-importer/DESIGN.md's toolchain note) -- --accept-license
          # is xwin's own documented non-interactive flag for CI use.
          # Headers are used only for layout parsing, cached only within
          # this repo's own CI, never redistributed.
          curl -fL -o /tmp/xwin.tar.gz \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p /tmp/xwin-bin
          tar -xzf /tmp/xwin.tar.gz -C /tmp/xwin-bin --strip-components=1
          /tmp/xwin-bin/xwin --accept-license splat --output ~/tools/winsdk

      - name: Record CommonLibSSE-NG submodule revision
        id: commonlib-rev
        run: |
          SHA=$(git -C type-importer/vendor/CommonLibSSE-NG rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.runtime_label }} .gdt (full RE/ sweep)
        env:
          RUNTIME_DEFINE: ${{ matrix.runtime_macro }}=1
        run: |
          set -euo pipefail
          cd type-importer/scripts
          HEADERS=$(./list_re_headers.sh ../vendor/CommonLibSSE-NG/include)

          JAVA_HOME="$JAVA_HOME" \
          GHIDRA_INSTALL_DIR="$HOME/tools/ghidra" \
          LD_LIBRARY_PATH="$HOME/tools/llvm/lib" \
          RUNTIME_DEFINE="$RUNTIME_DEFINE" \
            ./generate_gdt.sh "$HOME/tools/winsdk" \
              "$RUNNER_TEMP/CommonLibSSE_${{ matrix.runtime_label }}_${{ steps.commonlib-rev.outputs.sha }}.gdt" \
              $HEADERS

      - name: Upload .gdt artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommonLibSSE_${{ matrix.runtime_label }}_${{ steps.commonlib-rev.outputs.sha }}
          path: ${{ runner.temp }}/CommonLibSSE_${{ matrix.runtime_label }}_${{ steps.commonlib-rev.outputs.sha }}.gdt
          retention-days: 90

      # Opt-in, manual-only: publishes a public, versioned GitHub Release
      # (per runtime in the matrix) with the .gdt attached, so a modder
      # can download a release asset directly instead of cloning the repo
      # and running the pipeline (or digging through workflow-artifact
      # history, which requires a logged-in GitHub account and expires
      # after 90 days). Off by default -- a normal workflow_dispatch run
      # only produces the artifact above, same as before this step
      # existed.
      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag_prefix != '' && format('{0}-{1}-{2}', matrix.runtime_label, matrix.runtime_version, inputs.release_tag_prefix) || '' }}
          RUNTIME_LABEL: ${{ matrix.runtime_label }}
          RUNTIME_VERSION: ${{ matrix.runtime_version }}
          COMMONLIB_SHA: ${{ steps.commonlib-rev.outputs.sha }}
          GDT_PATH: ${{ runner.temp }}/CommonLibSSE_${{ matrix.runtime_label }}_${{ steps.commonlib-rev.outputs.sha }}.gdt
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "publish_release was checked but release_tag_prefix is empty -- refusing to publish an untagged release." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$GDT_PATH" \
            --repo "${{ github.repository }}" \
            --title "$RUNTIME_LABEL $RUNTIME_VERSION type archive ($RELEASE_TAG)" \
            --notes "Full-namespace CommonLibSSE-NG $RUNTIME_LABEL $RUNTIME_VERSION .gdt, built from CommonLibSSE-NG @ $COMMONLIB_SHA. See symbol-archive/README.md for the accuracy caveat -- not every class in this archive is byte-accurate yet; check type-importer/coverage_baseline*.json and the hotspot list in type-importer/COVERAGE_SWEEP_PLAN.md before trusting a specific struct."
