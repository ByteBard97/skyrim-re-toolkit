name: symbol-archive build (AE/SE/VR)

# Builds real CommonLibSSE-NG type archives (.gdt) for each supported
# runtime and publishes them as workflow artifacts -- see
# symbol-archive/README.md. Matrix mirrors type-importer-coverage.yml's
# own AE/SE/VR runtime matrix (see that workflow for the pattern this
# copies) -- GOG isn't listed separately because type-importer's Track 1
# work confirmed it shares AE 1.6.1170's macro/layout with no distinct
# static_assert set to validate against (see
# type-importer/COVERAGE_SWEEP_PLAN.md's v0.2 writeup).
#
# This is NOT a quality gate (unlike type-importer-coverage.yml, which
# fails the build on regression). type-importer's own coverage sweep
# currently shows ~2,100/3,180 (66%) of checkable classes as byte-accurate
# per runtime -- see the committed coverage_baseline*.json files for the
# exact current numbers, not this comment, which will drift (see
# type-importer/COVERAGE_SWEEP_PLAN.md) -- this workflow exists to
# produce real, traceable build artifacts for testing/dogfooding, not to
# assert any archive is fully trustworthy. Don't gate this on the
# coverage sweep passing; that would block every build indefinitely
# until type-importer's pass rate is much higher.
#
# Manual dispatch only for now -- see symbol-archive/README.md's roadmap
# for why this isn't push-triggered yet. Set the publish_release input to
# also cut a single public, versioned GitHub Release (tag
# gdt-<release_version>) carrying all three runtime .gdt files (off by
# default).
#
# Toolchain versions match type-importer-coverage.yml (keep them in sync
# if either is bumped): Ghidra 12.1.3, LLVM/libclang 19.1.0, JDK 25
# (Temurin), xwin 0.10.0. Fully Linux-native — no Windows runner needed.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: >-
          Publish this build as a single public, versioned GitHub
          Release carrying all three runtime .gdt files (in addition to
          the usual workflow artifacts). Leave unchecked for a normal
          test/dogfooding build.
        type: boolean
        default: false
      release_version:
        description: >-
          Version suffix for the release tag when publish_release is
          checked, e.g. "v1" produces tag "gdt-v1". Required only when
          publishing.
        type: string
        default: ""

env:
  GHIDRA_VERSION: "12.1.3"
  GHIDRA_ASSET: "ghidra_12.1.3_PUBLIC_20260817.zip"
  LLVM_VERSION: "19.1.0"
  XWIN_VERSION: "0.10.0"

jobs:
  build-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_macro: ENABLE_SKYRIM_AE
            runtime_label: AE
            runtime_version: "1.6.1170"
            baseline_file: coverage_baseline.json
          - runtime_macro: ENABLE_SKYRIM_SE
            runtime_label: SE
            runtime_version: "1.5.97"
            baseline_file: coverage_baseline_se.json
          - runtime_macro: ENABLE_SKYRIM_VR
            runtime_label: VR
            runtime_version: "1.4.15"
            baseline_file: coverage_baseline_vr.json
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/tools/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}

      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools
          curl -fL -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_ASSET}"
          unzip -q /tmp/ghidra.zip -d ~/tools/ghidra-extract
          mv ~/tools/ghidra-extract/ghidra_${GHIDRA_VERSION}_PUBLIC ~/tools/ghidra

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/tools/llvm
          key: llvm-${{ env.LLVM_VERSION }}

      - name: Download LLVM (for libclang 19+ -- system libclang is too old, see type-importer/DESIGN.md)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools
          curl -fL -o /tmp/llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          mkdir -p ~/tools/llvm
          tar -xf /tmp/llvm.tar.xz -C ~/tools/llvm --strip-components=1

      - name: Cache xwin Windows SDK/CRT splat
        id: cache-winsdk
        uses: actions/cache@v4
        with:
          path: ~/tools/winsdk
          key: winsdk-xwin-${{ env.XWIN_VERSION }}-v1

      - name: Acquire Windows SDK/CRT headers via xwin
        if: steps.cache-winsdk.outputs.cache-hit != 'true'
        run: |
          # Microsoft's own license terms apply to the splat output (see
          # type-importer/DESIGN.md's toolchain note) -- --accept-license
          # is xwin's own documented non-interactive flag for CI use.
          # Headers are used only for layout parsing, cached only within
          # this repo's own CI, never redistributed.
          curl -fL -o /tmp/xwin.tar.gz \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p /tmp/xwin-bin
          tar -xzf /tmp/xwin.tar.gz -C /tmp/xwin-bin --strip-components=1
          /tmp/xwin-bin/xwin --accept-license splat --output ~/tools/winsdk

      - name: Record CommonLibSSE-NG submodule revision
        id: commonlib-rev
        run: |
          SHA=$(git -C type-importer/vendor/CommonLibSSE-NG rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.runtime_label }} .gdt (full RE/ sweep)
        env:
          RUNTIME_DEFINE: ${{ matrix.runtime_macro }}=1
        run: |
          set -euo pipefail
          cd type-importer/scripts
          HEADERS=$(./list_re_headers.sh ../vendor/CommonLibSSE-NG/include)

          JAVA_HOME="$JAVA_HOME" \
          GHIDRA_INSTALL_DIR="$HOME/tools/ghidra" \
          LD_LIBRARY_PATH="$HOME/tools/llvm/lib" \
          RUNTIME_DEFINE="$RUNTIME_DEFINE" \
            ./generate_gdt.sh "$HOME/tools/winsdk" \
              "$RUNNER_TEMP/CommonLibSSE_${{ matrix.runtime_label }}_${{ steps.commonlib-rev.outputs.sha }}.gdt" \
              $HEADERS

      - name: Write ${{ matrix.runtime_label }} accuracy summary
        env:
          RUNTIME_LABEL: ${{ matrix.runtime_label }}
          RUNTIME_VERSION: ${{ matrix.runtime_version }}
          BASELINE_FILE: ${{ matrix.baseline_file }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          label = os.environ["RUNTIME_LABEL"]
          version = os.environ["RUNTIME_VERSION"]
          baseline_path = f"type-importer/{os.environ['BASELINE_FILE']}"

          d = json.load(open(baseline_path))
          checkable = sum(1 for e in d.values() if e.get("status") != "NO_GROUND_TRUTH")
          ok = sum(1 for e in d.values() if e.get("status") == "OK")
          total = len(d)
          pct = (100 * ok / checkable) if checkable else 0.0

          print(f"### {label} {version}")
          print()
          print(f"- **{ok:,} of {checkable:,} checkable classes byte-accurate ({pct:.0f}%)**")
          print(f"- {total:,} classes tracked total in `{os.environ['BASELINE_FILE']}`")
          print(f"- Baseline as committed at build time — not a live re-check of this build's output, see `symbol-archive/README.md`")
          print()
          PYEOF

      - name: Upload .gdt artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommonLibSSE_${{ matrix.runtime_label }}_${{ steps.commonlib-rev.outputs.sha }}
          path: ${{ runner.temp }}/CommonLibSSE_${{ matrix.runtime_label }}_${{ steps.commonlib-rev.outputs.sha }}.gdt
          retention-days: 90

  # Opt-in, manual-only: collects the three matrix-built .gdt artifacts
  # and publishes ONE public, versioned GitHub Release with all three
  # attached, so a modder can download a release asset directly instead
  # of cloning the repo and running the pipeline (or digging through
  # workflow-artifact history, which requires a logged-in GitHub account
  # and expires after 90 days). Off by default -- with publish_release
  # unchecked this job never runs and the workflow is artifacts-only,
  # exactly as before this job existed.
  publish-release:
    needs: build-archive
    if: ${{ inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create a release; build job keeps default perms
    steps:
      - name: Checkout (for type-importer/coverage_baseline*.json)
        uses: actions/checkout@v4

      - name: Download all matrix .gdt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CommonLibSSE_*
          path: gdts
          merge-multiple: true

      # Uses gh (preinstalled on ubuntu runners) rather than
      # softprops/action-gh-release: this workflow otherwise only uses
      # first-party actions, and gh keeps the release body generation in
      # plain bash with no new third-party action to pin and trust.
      - name: Create versioned AE/SE/VR release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_VERSION" ]; then
            echo "publish_release was checked but release_version is empty -- refusing to publish an untagged release." >&2
            exit 1
          fi
          TAG="gdt-${RELEASE_VERSION}"

          shopt -s nullglob
          GDT_FILES=(gdts/*.gdt)
          if [ "${#GDT_FILES[@]}" -ne 3 ]; then
            echo "expected 3 .gdt artifacts (AE/SE/VR), found ${#GDT_FILES[@]}:" >&2
            ls -la gdts >&2
            exit 1
          fi

          # Artifact filenames embed the short CommonLibSSE-NG submodule
          # SHA they were built from (CommonLibSSE_<runtime>_<sha>.gdt,
          # identical across the matrix since all legs check out the
          # same commit).
          COMMONLIB_SHA=$(basename "${GDT_FILES[0]}" .gdt | sed 's/.*_//')

          # Accuracy numbers are computed from the checked-in coverage
          # baselines AT PUBLISH TIME -- refresh coverage_baseline*.json
          # before publishing and do NOT hardcode these numbers here.
          ACCURACY_LINES=$(python3 - <<'PYEOF'
          import json
          for label, path in (("AE", "type-importer/coverage_baseline.json"),
                              ("SE", "type-importer/coverage_baseline_se.json"),
                              ("VR", "type-importer/coverage_baseline_vr.json")):
              d = json.load(open(path))
              checkable = sum(1 for e in d.values() if e.get("status") != "NO_GROUND_TRUTH")
              ok = sum(1 for e in d.values() if e.get("status") == "OK")
              print(f"- {label}: {ok:,} of {checkable:,} checkable classes byte-accurate ({100*ok/checkable:.0f}%)")
          PYEOF
          )

          gh release create "$TAG" "${GDT_FILES[@]}" \
            --repo "${{ github.repository }}" \
            --title "CommonLibSSE-NG type archives AE/SE/VR ($TAG)" \
            --notes "$(cat <<NOTESEOF
          Full-namespace CommonLibSSE-NG .gdt type archives for Skyrim AE 1.6.1170 / SE 1.5.97 / VR 1.4.15, built from CommonLibSSE-NG @ ${COMMONLIB_SHA}.

          Accuracy caveat: not every class in these archives is byte-accurate. Per the checked-in coverage baselines at publish time:
          ${ACCURACY_LINES}

          See symbol-archive/README.md and the hotspot list in type-importer/COVERAGE_SWEEP_PLAN.md before trusting a specific struct.
          NOTESEOF
          )"
