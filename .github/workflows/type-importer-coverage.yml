name: type-importer coverage sweep

# Regression gate for the type-importer parser pipeline (see
# type-importer/COVERAGE_SWEEP_PLAN.md). Runs the full CommonLibSSE-NG
# RE/ header sweep and fails the build if any class's resolved layout got
# WORSE relative to type-importer/coverage_baseline*.json -- e.g. a patch
# to GhidraClangPoweredParse or stubs/layout_pch.h that fixes one class
# but silently breaks another. See scripts/check_regression.py's
# docstring for the exact comparison rules.
#
# Runs as a matrix over runtimes (AE, SE -- see
# type-importer/RUNTIME_SE_1_5_97.md) so a patch can't silently regress
# one runtime's layout while only being checked against the other's
# baseline. Each runtime gets its own full sweep and its own committed
# coverage_baseline_<runtime>.json (AE keeps the original unsuffixed
# coverage_baseline.json for backward compatibility with existing local
# workflows/scripts).
#
# Toolchain versions pinned here match what was verified locally when
# this workflow was written (see DESIGN.md's toolchain note for why each
# constraint exists -- Ghidra 12+, libclang 19+, JDK 22+ for final-API Panama FFI (21 preview FFM + -Xint deprecated, see patches/0010-*.md)):
#   Ghidra 12.1.3, LLVM/libclang 19.1.0, JDK 25 (Temurin), xwin 0.10.0
#
# Fully Linux-native -- runs on ubuntu-latest, no Windows runner needed
# (that's only required for runtime-harness).

on:
  push:
    paths:
      - "type-importer/**"
      - ".github/workflows/type-importer-coverage.yml"
  pull_request:
    paths:
      - "type-importer/**"
      - ".github/workflows/type-importer-coverage.yml"
  workflow_dispatch:
    inputs:
      debug_deps:
        description: "Substring: print which dependency blocks matching types (GCPP_DEBUG_DEPS)"
        required: false
        default: ""

env:
  GHIDRA_VERSION: "12.1.3"
  GHIDRA_ASSET: "ghidra_12.1.3_PUBLIC_20260817.zip"
  LLVM_VERSION: "19.1.0"
  XWIN_VERSION: "0.10.0"

jobs:
  coverage-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_macro: ENABLE_SKYRIM_AE
            baseline_file: coverage_baseline.json
          - runtime_macro: ENABLE_SKYRIM_SE
            baseline_file: coverage_baseline_se.json
          - runtime_macro: ENABLE_SKYRIM_VR
            baseline_file: coverage_baseline_vr.json
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/tools/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}

      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools
          curl -fL -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_ASSET}"
          unzip -q /tmp/ghidra.zip -d ~/tools/ghidra-extract
          mv ~/tools/ghidra-extract/ghidra_${GHIDRA_VERSION}_PUBLIC ~/tools/ghidra

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/tools/llvm
          key: llvm-${{ env.LLVM_VERSION }}

      - name: Download LLVM (for libclang 19+ -- system libclang is too old, see DESIGN.md)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools
          curl -fL -o /tmp/llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          mkdir -p ~/tools/llvm
          tar -xf /tmp/llvm.tar.xz -C ~/tools/llvm --strip-components=1

      - name: Cache xwin Windows SDK/CRT splat
        id: cache-winsdk
        uses: actions/cache@v4
        with:
          path: ~/tools/winsdk
          key: winsdk-xwin-${{ env.XWIN_VERSION }}-v1

      - name: Acquire Windows SDK/CRT headers via xwin
        if: steps.cache-winsdk.outputs.cache-hit != 'true'
        run: |
          # Microsoft's own license terms apply to the splat output (see
          # DESIGN.md's toolchain note) -- --accept-license is xwin's own
          # documented non-interactive flag for CI use, the standard way
          # Rust's windows-msvc cross-compilation CI jobs do this too.
          # We only ever use the headers for layout parsing; nothing here
          # is redistributed (cached only within this repo's own CI).
          curl -fL -o /tmp/xwin.tar.gz \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p /tmp/xwin-bin
          tar -xzf /tmp/xwin.tar.gz -C /tmp/xwin-bin --strip-components=1
          /tmp/xwin-bin/xwin --accept-license splat --output ~/tools/winsdk

      - name: Run coverage sweep (${{ matrix.runtime_macro }})
        env:
          # Opt-in dependency-blocker tracing (TypePool.checkDependenciesFulfilled,
          # patch 0011) -- set via workflow_dispatch to debug runner-only
          # divergences without touching code.
          GCPP_DEBUG_DEPS: ${{ inputs.debug_deps || '' }}
          RUNTIME_DEFINE: ${{ matrix.runtime_macro }}=1
        run: |
          set -euo pipefail
          cd type-importer/scripts
          SCRATCH="$RUNNER_TEMP/coverage-sweep"
          mkdir -p "$SCRATCH"
          HEADERS=$(./list_re_headers.sh ../vendor/CommonLibSSE-NG/include)

          JAVA_HOME="$JAVA_HOME" \
          GHIDRA_INSTALL_DIR="$HOME/tools/ghidra" \
          LD_LIBRARY_PATH="$HOME/tools/llvm/lib" \
          RUNTIME_DEFINE="$RUNTIME_DEFINE" \
          REPORT_CSV="$SCRATCH/report.csv" \
            ./generate_gdt.sh "$HOME/tools/winsdk" "$SCRATCH/full_re.gdt" $HEADERS

          python3 mine_static_asserts.py ../vendor/CommonLibSSE-NG/include \
            --runtime "${{ matrix.runtime_macro }}" --json "$SCRATCH/expected_sizes.json" > /dev/null
          python3 coverage_report.py \
            --expected "$SCRATCH/expected_sizes.json" \
            --actual "$SCRATCH/report.csv" \
            --actual-unresolved "$SCRATCH/report.csv.unresolved.txt" \
            --scope-note "CI full RE/*.h sweep (${{ matrix.runtime_macro }}), run ${{ github.run_id }}" \
            --json-out "$SCRATCH/snapshot.json" \
            > "$SCRATCH/report.txt"
          cat "$SCRATCH/report.txt"

          echo "SNAPSHOT_PATH=$SCRATCH/snapshot.json" >> "$GITHUB_ENV"

      - name: Check for regressions against the committed baseline
        run: |
          cd type-importer/scripts
          python3 check_regression.py --baseline "../${{ matrix.baseline_file }}" --new "$SNAPSHOT_PATH"

      - name: Upload sweep report (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sweep-report-${{ matrix.runtime_macro }}
          path: |
            ${{ runner.temp }}/coverage-sweep/report.txt
            ${{ runner.temp }}/coverage-sweep/snapshot.json
          retention-days: 30
